# One-click deploy to Render (https://render.com).
# Push this repo, "New + → Blueprint", point it here.
databases:
  # Free Postgres for persistent coverage memory (survives restarts/redeploys).
  - name: stockanalyser-db
    plan: free

services:
  - type: web
    name: stockanalyser
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Coverage memory persists to the Postgres above; the app reads DATABASE_URL.
      - key: DATABASE_URL
        fromDatabase:
          name: stockanalyser-db
          property: connectionString
      # Record L4/L5 calls made through the site (off unless set to 1).
      - key: COVERAGE_RECORD
        value: "1"
      # Optional — enables live data / LLM narrative. Leave unset to run on
      # bundled illustrative snapshots + the deterministic narrative.
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
