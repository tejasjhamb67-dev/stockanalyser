# One-click deploy to Render (https://render.com).
# Push this repo, "New + → Blueprint", point it here.
services:
  - type: web
    name: stockanalyser
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Optional — enables live data / LLM narrative. Leave unset to run on
      # bundled illustrative snapshots + the deterministic narrative.
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
